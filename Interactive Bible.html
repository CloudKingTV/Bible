<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Holy Bible — Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturCook:wght@700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* ===== Classic leather-bound Bible aesthetic ===== */
:root {
  --paper: #f2e8d0;
  --paper-edge: #d9c9a3;
  --paper-shadow: #8a7548;
  --ink: #2b1d12;
  --ink-soft: #6b5538;
  --rubric: #8b2a1a;          /* red ink for chapter numbers */
  --leather: #3a1d10;
  --leather-dark: #1e0f07;
  --leather-hi: #5a2e18;
  --gold: #c9a14a;
  --gold-hi: #ecd181;
  --gold-dark: #7a5c1d;
  --ribbon: #7a1320;
  --ribbon-hi: #a62433;
  --ribbon-dark: #470610;
  --tab-ot: #6a2e1c;
  --tab-nt: #2f3a4d;
  --table: #3b2414;
  --table-hi: #5a3821;
  --flip-speed: 900ms;
  --font-size: 15px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  background: #1a0f06;
  color: var(--ink);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ===== Wooden table surface ===== */
.table-surface {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 60%, rgba(255,200,120,0.12), transparent 55%),
    repeating-linear-gradient(92deg,
      #3d2515 0 3px,
      #4a2d19 3px 7px,
      #38200f 7px 14px,
      #452a16 14px 22px),
    #2a1708;
  overflow: hidden;
}
.table-surface::before {
  /* long wood grain streaks */
  content: "";
  position: absolute; inset: -10%;
  background:
    repeating-linear-gradient(91deg,
      transparent 0 80px,
      rgba(0,0,0,0.18) 80px 82px,
      transparent 82px 160px),
    repeating-linear-gradient(89deg,
      transparent 0 140px,
      rgba(255,220,160,0.06) 140px 142px,
      transparent 142px 300px);
  filter: blur(0.4px);
  pointer-events: none;
}
.table-surface::after {
  /* vignette */
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgba(0,0,0,0.55) 80%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}

/* Soft candle-light flicker */
.candle-light {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 900px 600px at 50% 30%, rgba(255,210,150,0.14), transparent 60%);
  animation: flicker 5s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes flicker {
  0% { opacity: 0.85; transform: translate(0, 0); }
  50% { opacity: 1; transform: translate(2px, -1px); }
  100% { opacity: 0.9; transform: translate(-1px, 2px); }
}

/* ===== Book stage (3D tilt) ===== */
.stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  perspective: 2600px;
  perspective-origin: 50% 30%;
}
.book-tilt {
  transform: rotateX(38deg) rotateZ(-0.5deg);
  transform-style: preserve-3d;
  transform-origin: 50% 70%;
  filter: drop-shadow(0 60px 40px rgba(0,0,0,0.6));
}

/* ===== Book (open) ===== */
.book {
  position: relative;
  transform-style: preserve-3d;
}

/* Back cover + base stack visible behind pages */
.book-base {
  position: absolute;
  left: -18px; top: -14px;
  right: -18px; bottom: -14px;
  background:
    linear-gradient(180deg, var(--leather-hi) 0%, var(--leather) 40%, var(--leather-dark) 100%);
  border-radius: 6px 10px 10px 6px;
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,0.4),
    inset 0 0 60px rgba(0,0,0,0.55),
    0 30px 50px rgba(0,0,0,0.5);
  transform: translateZ(-18px);
}
.book-base::before {
  /* leather grain */
  content: "";
  position: absolute; inset: 6px;
  border-radius: 4px;
  background:
    repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.18) 0 2px, transparent 2px 5px),
    repeating-radial-gradient(circle at 70% 80%, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(45deg, rgba(0,0,0,0.08) 0 3px, transparent 3px 7px);
  opacity: 0.7;
}
.book-base::after {
  /* gold border frame */
  content: "";
  position: absolute; inset: 12px;
  border: 1.5px solid var(--gold-dark);
  border-radius: 2px;
  box-shadow: inset 0 0 0 3px transparent, inset 0 0 0 4px var(--gold-dark);
}

/* Page edges (the thick stack of paper) */
.page-edges {
  position: absolute;
  top: 4px; bottom: 4px;
  left: 0; right: 0;
  pointer-events: none;
  z-index: 0;
}
.page-edges::before, .page-edges::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 14px;
  background: repeating-linear-gradient(0deg,
    var(--paper-edge) 0 1px,
    var(--paper-shadow) 1px 2px,
    var(--paper-edge) 2px 3px);
  box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
}
.page-edges::before {
  left: -14px;
  border-radius: 3px 0 0 3px;
}
.page-edges::after {
  right: -14px;
  border-radius: 0 3px 3px 0;
}

/* Spread (two pages side by side) */
.spread {
  position: relative;
  display: flex;
  transform-style: preserve-3d;
}
.page {
  position: relative;
  width: var(--page-w);
  height: var(--page-h);
  background:
    radial-gradient(ellipse at 50% 30%, #f7eed6 0%, var(--paper) 50%, #e4d5b0 100%);
  overflow: hidden;
  box-shadow: inset 0 0 60px rgba(120, 80, 30, 0.25);
}
.page.left {
  border-radius: 4px 0 0 4px;
  box-shadow:
    inset -20px 0 30px -10px rgba(80,50,20,0.35),
    inset 0 0 60px rgba(120, 80, 30, 0.22);
}
.page.right {
  border-radius: 0 4px 4px 0;
  box-shadow:
    inset 20px 0 30px -10px rgba(80,50,20,0.35),
    inset 0 0 60px rgba(120, 80, 30, 0.22);
}

/* Paper texture overlay */
.page::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(120,80,30,0.08) 0 1px, transparent 1px),
    radial-gradient(circle at 80% 60%, rgba(120,80,30,0.1) 0 1px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(120,80,30,0.06) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 30%, rgba(120,80,30,0.07) 0 1px, transparent 1px);
  background-size: 130px 130px, 170px 170px, 200px 200px, 110px 110px;
  opacity: 0.9;
  pointer-events: none;
}
.page::after {
  /* subtle foxing stain */
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80px 50px at 15% 85%, rgba(140,100,40,0.12), transparent 70%),
    radial-gradient(ellipse 60px 40px at 90% 12%, rgba(140,100,40,0.1), transparent 70%);
  pointer-events: none;
}

/* Page content */
.page-inner {
  position: absolute;
  inset: 0;
  padding: 40px 48px 48px 48px;
  display: flex; flex-direction: column;
  font-size: var(--font-size);
  line-height: 1.5;
  color: var(--ink);
}
.page.left .page-inner { padding-right: 36px; padding-left: 56px; }
.page.right .page-inner { padding-left: 36px; padding-right: 56px; }

.page-header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  text-transform: uppercase;
  border-bottom: 1px solid rgba(100, 70, 30, 0.3);
  padding-bottom: 8px;
  margin-bottom: 18px;
}
.page-footer {
  position: absolute;
  bottom: 16px; left: 56px; right: 56px;
  display: flex; justify-content: center;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.2em;
}
.page.right .page-footer { justify-content: center; }

.book-title-heading {
  font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
  font-size: 1.9em;
  text-align: center;
  letter-spacing: 0.15em;
  color: var(--ink);
  margin: 8px 0 4px 0;
  text-transform: uppercase;
}
.book-title-heading .flourish {
  display: block;
  font-size: 0.5em;
  color: var(--ink-soft);
  letter-spacing: 0.4em;
  margin-top: 6px;
}

.chapter-heading {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 0.85em;
  letter-spacing: 0.35em;
  text-align: center;
  color: var(--ink-soft);
  margin: 8px 0 18px 0;
  text-transform: uppercase;
}

.drop-cap {
  float: left;
  font-family: 'UnifrakturCook', 'UnifrakturMaguntia', 'Cinzel', serif;
  font-size: 4.2em;
  line-height: 0.85;
  padding: 8px 10px 0 0;
  color: var(--rubric);
  font-weight: 700;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
}
.verses {
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
  columns: 1;
  text-indent: 0;
}
.verse-num {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 0.72em;
  vertical-align: super;
  color: var(--rubric);
  margin: 0 3px 0 2px;
  font-weight: 700;
}
.verse { display: inline; }

/* Title spread (left page) */
.title-plate {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 30px;
}
.title-plate .ornament {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.6em;
  color: var(--ink-soft);
  margin: 10px 0;
}
.title-plate h1 {
  font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
  font-size: 2.6em;
  letter-spacing: 0.15em;
  margin: 14px 0;
  color: var(--ink);
  text-transform: uppercase;
}
.title-plate h2 {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 0.9em;
  letter-spacing: 0.35em;
  color: var(--ink-soft);
  margin: 6px 0;
  font-weight: 400;
  text-transform: uppercase;
}
.title-plate .imprint {
  margin-top: 60px;
  font-size: 0.75em;
  color: var(--ink-soft);
  font-style: italic;
  letter-spacing: 0.08em;
}

.ornament-bar {
  width: 60%;
  height: 20px;
  margin: 16px auto;
  background-image:
    radial-gradient(circle at 50% 50%, var(--ink-soft) 0 2px, transparent 2px),
    linear-gradient(90deg, transparent 0%, var(--ink-soft) 20%, var(--ink-soft) 80%, transparent 100%);
  background-size: 100% 100%, 100% 1px;
  background-position: center, center;
  background-repeat: no-repeat;
}

/* Center gutter shadow */
.gutter {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: 30px;
  transform: translateX(-50%);
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(40,20,5,0.0) 30%,
    rgba(40,20,5,0.45) 50%,
    rgba(40,20,5,0.0) 70%,
    transparent 100%);
  pointer-events: none;
  z-index: 15;
}

/* ===== Flipping page ===== */
.flip-layer {
  position: absolute;
  top: 0;
  left: 50%;
  width: var(--page-w);
  height: var(--page-h);
  transform-origin: left center;
  transform-style: preserve-3d;
  z-index: 20;
  will-change: transform;
}
.flip-layer.reverse {
  left: calc(50% - var(--page-w));
  transform-origin: right center;
}
.flip-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.flip-face.front { /* the recto side shown initially */ }
.flip-face.back {
  transform: rotateY(180deg);
}

/* Curl shadow that follows the flipping page */
.flip-shadow {
  position: absolute;
  top: 0; bottom: 0;
  width: 120px;
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.7;
  transition: opacity 300ms;
}

/* Riffle (multi-page) visual */
.riffle-layer {
  position: absolute;
  top: 0; left: 50%;
  width: var(--page-w);
  height: var(--page-h);
  transform-origin: left center;
  pointer-events: none;
  z-index: 25;
}
.riffle-sheet {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #efe3c3 0%, #e0d0a4 100%);
  border-right: 1px solid rgba(100,70,30,0.3);
  box-shadow: 0 0 12px rgba(0,0,0,0.3);
  transform-origin: left center;
  backface-visibility: hidden;
}

/* ===== Thumb-index group tabs ===== */
.tabs {
  position: absolute;
  top: 24px; bottom: 24px;
  width: 34px;
  display: flex; flex-direction: column;
  gap: 3px;
  z-index: 5;
}
.tabs.right { right: -34px; }
.group-tab {
  flex: 1;
  min-height: 30px;
  cursor: pointer;
  position: relative;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 6px;
  color: #f0e3c2;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 8.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transition: all 220ms ease;
  border-radius: 0 4px 4px 0;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.35), 2px 2px 4px rgba(0,0,0,0.4);
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.group-tab.ot-group { background: linear-gradient(90deg, #8a3a22 0%, #5a2414 100%); }
.group-tab.nt-group { background: linear-gradient(90deg, #4a5870 0%, #222b3a 100%); }
.group-tab::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 6px);
  pointer-events: none;
  border-radius: inherit;
}
.group-tab:hover {
  transform: translateX(5px);
  filter: brightness(1.25);
  color: var(--gold-hi);
}
.group-tab.current {
  transform: translateX(7px);
  box-shadow: inset 0 0 12px rgba(0,0,0,0.35), -3px 0 14px rgba(255,210,120,0.45);
  color: var(--gold-hi);
}
.group-tab.current::after {
  content: "";
  position: absolute;
  left: -2px; top: 50%;
  width: 3px; height: 60%;
  background: var(--gold-hi);
  transform: translateY(-50%);
  box-shadow: 0 0 6px var(--gold-hi);
  border-radius: 2px;
}

/* Flyout book picker */
.flyout {
  position: absolute;
  top: 0;
  max-height: min(70vh, 520px);
  width: 220px;
  background: rgba(30, 15, 5, 0.96);
  border: 1px solid var(--gold-dark);
  border-radius: 4px;
  padding: 12px 8px 12px 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  overflow-y: auto;
  z-index: 60;
  color: #e8d5a8;
  backdrop-filter: blur(8px);
}
/* Touch the tab directly so the hover can cross without a dead zone. A small
   invisible bridge on the near side gives the pointer some slack. */
.flyout-right {
  left: 100%;
  padding-left: 22px;
  margin-left: -8px;
}
.flyout-left {
  right: 100%;
  padding-right: 22px;
  margin-right: -8px;
}
.flyout-title {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold-hi);
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gold-dark);
}
.flyout-group {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 8.5px;
  letter-spacing: 0.25em;
  color: var(--gold-dark);
  text-transform: uppercase;
  margin: 12px 0 4px 0;
}
.flyout-book {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 13px;
  padding: 3px 8px;
  cursor: pointer;
  border-radius: 3px;
  display: flex; justify-content: space-between; align-items: baseline;
  color: #e8d5a8;
  transition: all 150ms;
}
.flyout-book:hover { background: rgba(201,161,74,0.15); color: var(--gold-hi); padding-left: 12px; }
.flyout-book.current { background: rgba(201,161,74,0.25); color: var(--gold-hi); }
.flyout-book .num {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  color: var(--gold-dark);
  letter-spacing: 0.15em;
}
.flyout::-webkit-scrollbar { width: 6px; }
.flyout::-webkit-scrollbar-track { background: transparent; }
.flyout::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

/* ===== Ribbon bookmark ===== */
.ribbon {
  position: absolute;
  top: -4px;
  width: 26px;
  background: linear-gradient(90deg, var(--ribbon-dark) 0%, var(--ribbon) 30%, var(--ribbon-hi) 50%, var(--ribbon) 70%, var(--ribbon-dark) 100%);
  box-shadow:
    inset 0 0 4px rgba(0,0,0,0.4),
    2px 3px 8px rgba(0,0,0,0.5);
  pointer-events: auto;
  cursor: grab;
  transform-origin: 50% 0;
  z-index: 30;
  border-radius: 0 0 2px 2px;
}
.ribbon:active { cursor: grabbing; }
.ribbon::after {
  content: "";
  position: absolute;
  bottom: -12px; left: 0; right: 0;
  height: 14px;
  background: inherit;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 40%, 0 100%);
}
.ribbon::before {
  /* weave texture */
  content: "";
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 4px);
  pointer-events: none;
}

/* ===== Drag-corner hint ===== */
.corner-hint {
  position: absolute;
  bottom: 0; right: 0;
  width: 60px; height: 60px;
  cursor: grab;
  z-index: 22;
  background: linear-gradient(135deg, transparent 50%, rgba(120,80,30,0.15) 50%, rgba(120,80,30,0.35) 100%);
  transition: opacity 300ms;
  opacity: 0.6;
}
.corner-hint:hover { opacity: 1; }
.corner-hint.left-corner {
  bottom: 0; left: 0; right: auto;
  background: linear-gradient(-135deg, transparent 50%, rgba(120,80,30,0.15) 50%, rgba(120,80,30,0.35) 100%);
  cursor: grab;
}

/* ===== Chrome / UI ===== */
.chrome {
  position: fixed;
  top: 18px; left: 18px;
  z-index: 100;
  color: #e8d5a8;
  font-family: 'Cinzel', Georgia, serif;
  letter-spacing: 0.2em;
  font-size: 11px;
  text-transform: uppercase;
}
.chrome h1 {
  margin: 0;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: var(--gold-hi);
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.chrome .sub { opacity: 0.65; margin-top: 4px; }

.nav-controls {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex; gap: 12px; align-items: center;
  background: rgba(30, 15, 5, 0.7);
  border: 1px solid rgba(201, 161, 74, 0.4);
  border-radius: 24px;
  padding: 8px 16px;
  backdrop-filter: blur(8px);
  color: #e8d5a8;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.15em;
}
.nav-btn {
  background: transparent;
  color: var(--gold-hi);
  border: 1px solid var(--gold-dark);
  border-radius: 50%;
  width: 32px; height: 32px;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 200ms;
  font-family: inherit;
}
.nav-btn:hover:not(:disabled) { background: rgba(201,161,74,0.15); border-color: var(--gold-hi); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-label { min-width: 160px; text-align: center; color: #e8d5a8; }

/* ===== Tweaks panel ===== */
.tweaks-panel {
  position: fixed;
  bottom: 80px; right: 18px;
  z-index: 200;
  width: 280px;
  background: rgba(25, 13, 5, 0.95);
  border: 1px solid var(--gold-dark);
  border-radius: 6px;
  padding: 16px 18px;
  color: #e8d5a8;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.tweaks-panel h3 {
  margin: 0 0 12px 0;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--gold-hi);
  text-transform: uppercase;
  border-bottom: 1px solid var(--gold-dark);
  padding-bottom: 6px;
}
.tweak-row {
  display: flex; flex-direction: column;
  gap: 6px; margin-bottom: 12px;
}
.tweak-row label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #c9a14a;
}
.tweak-swatches {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.tweak-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 150ms;
}
.tweak-swatch:hover { transform: scale(1.1); }
.tweak-swatch.active { border-color: var(--gold-hi); box-shadow: 0 0 8px var(--gold-hi); }
.tweak-row input[type="range"] {
  width: 100%;
  accent-color: var(--gold);
}
.tweak-row .options {
  display: flex; gap: 4px; flex-wrap: wrap;
}
.tweak-row .options button {
  background: transparent;
  border: 1px solid var(--gold-dark);
  color: #e8d5a8;
  padding: 4px 10px;
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.15em;
  border-radius: 3px;
  cursor: pointer;
  text-transform: uppercase;
}
.tweak-row .options button.active { background: var(--gold-dark); color: var(--leather-dark); }

/* ===== Page corner curl (during drag) ===== */
.curl-shadow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(-45deg, rgba(0,0,0,0.25), transparent 60%);
  opacity: 0;
  transition: opacity 200ms;
}

/* Cover variants */
.cover-burgundy .book-base {
  background: linear-gradient(180deg, #8a2838 0%, #5a1522 40%, #2e060f 100%);
}
.cover-black .book-base {
  background: linear-gradient(180deg, #303030 0%, #151515 40%, #050505 100%);
}
.cover-brown .book-base { /* default */ }

/* Paper variants */
.paper-aged { --paper: #f2e8d0; --paper-edge: #d9c9a3; --ink: #2b1d12; }
.paper-cream { --paper: #faf3de; --paper-edge: #e9dcba; --ink: #2a2015; }
.paper-linen { --paper: #ede0c0; --paper-edge: #c9b68a; --ink: #261a0e; }
.paper-antique { --paper: #e8d9b3; --paper-edge: #c4ad7a; --ink: #3a2817; }

/* Scroll nothing */
.verses-scroll {
  flex: 1;
  overflow: hidden;
}

@keyframes ribbon-flash {
  0%   { opacity: 0; transform: translate(-50%, 4px); }
  20%  { opacity: 1; transform: translate(-50%, 0); }
  80%  { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -4px); }
}

// Page content components
const { useState, useEffect, useRef, useMemo, useCallback } = React;

function TitleSpread() {

      <h2 style={{ fontSize: "0.65em", margin: "4px 0" }}>Containing the Old<br/>and New Testaments</h2>
      <div className="ornament-bar"></div>
      <div className="ornament" style={{ margin: "12px 0" }}>✠</div>
      <h2 style={{ fontSize: "0.6em", marginTop: 6 }}>Translated out of<br/>the Original Tongues</h2>
      <div className="imprint" style={{ marginTop: 18, fontSize: "0.62em" }}>
        Appointed to be read in Churches<br/>
        <span style={{ opacity: 0.6 }}>— Anno Domini MDCXI —</span>
      </div>
      <div className="ornament-bar" style={{ marginTop: 12 }}></div>
    </div>
  );
}

function TableOfContents({ testament, onPick, half }) {
  const books = window.BIBLE_BOOKS.filter(b => b.testament === testament);
  const grouped = {};
  books.forEach(b => {
    grouped[b.group] = grouped[b.group] || [];
    grouped[b.group].push(b);
  });
  let groupEntries = Object.entries(grouped);
  // Split OT into two pages: half 1 = Pentateuch/History; half 2 = Wisdom/Prophets
  if (testament === "OT") {
    if (half === 1) {
      groupEntries = groupEntries.filter(([g]) => ["Pentateuch","History"].includes(g));
    } else if (half === 2) {
      groupEntries = groupEntries.filter(([g]) => ["Wisdom","Major Prophets","Minor Prophets"].includes(g));
    }
  }
  // NT uses 2 columns (27 books)
  const useColumns = testament === "NT";
  const title = testament === "OT"
    ? (half === 2 ? "Old Testament · continued" : "Books of the Old Testament")
    : "Books of the New Testament";

    <div style={{ flex: 1, padding: "0 4px", fontSize: "0.85em", overflow: "hidden", display: "flex", flexDirection: "column" }}>

              <span style={{ color: "var(--ink-soft)", fontSize: "0.88em", flexShrink: 0 }}>

function TestamentDivider({ testament }) {
  return (
    <div className="title-plate">
      <div className="ornament">✠ ❦ ✠</div>
      <div className="ornament-bar"></div>
      <h1 style={{ fontSize: "1.7em", marginTop: 20 }}>

function BookOpeningPage({ book }) {
  const versesToShow = book.verses.slice(0, Math.ceil(book.verses.length / 2));
  return (
    <>
      <div className="page-header">
        <span>{book.testament === "OT" ? "Old Testament" : "New Testament"}</span>
        <span>{book.group}</span>
      </div>
      <div className="book-title-heading">
        {book.name}
        <span className="flourish">❦ Chapter I ❦</span>
      </div>
      <div className="verses-scroll">
        <p className="verses">
          <span className="drop-cap">{versesToShow[0]?.[0] || "T"}</span>
          {versesToShow.map((v, i) => (
            <span className="verse" key={i}>
              {i > 0 && <span className="verse-num">{i + 1}</span>}
              {i === 0 ? v.slice(1) : v}
              {" "}
            </span>
          ))}
        </p>
      </div>
      <div className="page-footer">
        <span style={{ letterSpacing: "0.25em" }}>— {book.abbr} · 1 —</span>
      </div>
    </>
  );
}

function BookContinuedPage({ book }) {
  const versesFromHalf = book.verses.slice(Math.ceil(book.verses.length / 2));
  return (
    <>
      <div className="page-header">
        <span>{book.name}</span>
        <span>Chapter I</span>
      </div>
      <div className="verses-scroll">
        <p className="verses">
          {versesFromHalf.map((v, i) => {
            const n = Math.ceil(book.verses.length / 2) + i + 1;
            return (
              <span className="verse" key={i}>
                <span className="verse-num">{n}</span>
                {v}{" "}
              </span>
            );
          })}
          <span style={{ color: "var(--ink-soft)", fontStyle: "italic", fontSize: "0.85em" }}>
            {" "}⁂ continued through {book.chapters} chapter{book.chapters > 1 ? "s" : ""} ⁂
          </span>
        </p>
      </div>
      <div className="page-footer">
        <span style={{ letterSpacing: "0.25em" }}>— {book.abbr} · 1 —</span>
      </div>
    </>
  );
}

function PageContent({ pageIndex, onPickBook }) {
  const TOC_PAGES = 4; // page 1 = OT half 1, page 2 = OT half 2, page 3 = NT
  const TOTAL = TOC_PAGES + window.BIBLE_BOOKS.length * 2;
  if (pageIndex < 0 || pageIndex >= TOTAL) {
    return <div className="title-plate"><div className="ornament" style={{ fontSize: "1.2em", letterSpacing: "0.4em" }}>⁂ FINIS ⁂</div></div>;
  }
  if (pageIndex === 0) return <TitleSpread />;
  if (pageIndex === 1) return <TableOfContents testament="OT" onPick={onPickBook} half={1} />;
  if (pageIndex === 2) return <TableOfContents testament="OT" onPick={onPickBook} half={2} />;
  if (pageIndex === 3) return <TableOfContents testament="NT" onPick={onPickBook} />;
  const bookPageIndex = pageIndex - TOC_PAGES;
  const bookIdx = Math.floor(bookPageIndex / 2);
  const side = bookPageIndex % 2;
  const book = window.BIBLE_BOOKS[bookIdx];
  if (!book) return <div className="title-plate"><div className="ornament">⁂ FINIS ⁂</div></div>;
  return side === 0
    ? <BookOpeningPage book={book} />
    : <BookContinuedPage book={book} />;
}

Object.assign(window, { PageContent, TitleSpread, TableOfContents, TestamentDivider, BookOpeningPage, BookContinuedPage });

</script>
<script type="text/babel">
// Main book component with page-flip physics
const { useState: uS, useEffect: uE, useRef: uR, useMemo: uM, useCallback: uC } = React;

const TOTAL_PAGES = 4 + window.BIBLE_BOOKS.length * 2;

function bookStartPage(book) {
  return 4 + book.index * 2;
}

const easeInOutQuint = (t) => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

function Book({ tweaks }) {
  const [current, setCurrent] = uS(() => {
    const saved = parseInt(localStorage.getItem("bible-page") || "0", 10);
    return isFinite(saved) && saved >= 0 && saved < TOTAL_PAGES ? (saved % 2 === 0 ? saved : saved - 1) : 0;
  });
  const [flipping, setFlipping] = uS(null);
  const [riffle, setRiffle] = uS(null);
  const [ribbonPage, setRibbonPage] = uS(() => {
    const v = localStorage.getItem("bible-ribbon");
    return v ? parseInt(v, 10) : 0;
  });
  const [ribbonDrag, setRibbonDrag] = uS(null);
  const [ribbonFlash, setRibbonFlash] = uS(false);

  const flipDurationMs = tweaks.flipSpeed;

  uE(() => { localStorage.setItem("bible-page", String(current)); }, [current]);
  uE(() => { localStorage.setItem("bible-ribbon", String(ribbonPage)); }, [ribbonPage]);

  const flippingRef = uR(null);
  const riffleRef = uR(null);

  const animateFlip = uC((direction, onDone) => {
    if (flippingRef.current || riffleRef.current) return;
    const start = performance.now();
    flippingRef.current = { direction, progress: 0 };
    setFlipping({ direction, progress: 0 });
    const tick = () => {
      const t = performance.now();
      const p = Math.min(1, (t - start) / flipDurationMs);
      const eased = easeInOutQuint(p);
      flippingRef.current = { direction, progress: eased };
      setFlipping({ direction, progress: eased });
      if (p < 1) requestAnimationFrame(tick);
      else {
        flippingRef.current = null;
        setFlipping(null);
        if (direction === "next") setCurrent(c => Math.min(TOTAL_PAGES - 2, c + 2));
        else setCurrent(c => Math.max(0, c - 2));
        onDone && onDone();
      }
    };
    requestAnimationFrame(tick);
  }, [flipDurationMs]);

  const animateRiffle = uC((fromPage, toPage) => {
    if (flippingRef.current || riffleRef.current) return;
    const direction = toPage > fromPage ? "next" : "prev";
    const sheetCount = Math.min(18, Math.max(4, Math.floor(Math.abs(toPage - fromPage) / 4)));
    const duration = Math.min(1800, 700 + sheetCount * 40) * (flipDurationMs / 900);
    const start = performance.now();
    const initial = { from: fromPage, to: toPage, progress: 0, direction, sheetCount, duration };
    riffleRef.current = initial;
    setRiffle(initial);
    const tick = () => {
      const t = performance.now();
      const p = Math.min(1, (t - start) / duration);
      const eased = easeInOutQuint(p);
      const next = { ...initial, progress: eased };
      riffleRef.current = next;
      setRiffle(next);
      if (p < 1) requestAnimationFrame(tick);
      else {
        riffleRef.current = null;
        setRiffle(null);
        setCurrent(toPage % 2 === 0 ? toPage : toPage - 1);
      }
    };
    requestAnimationFrame(tick);
  }, [flipDurationMs]);

  const goToBook = uC((book) => {
    const target = bookStartPage(book);
    if (Math.abs(target - current) <= 2) {
      if (target === current) return;
      animateFlip(target > current ? "next" : "prev");
    } else {
      animateRiffle(current, target);
    }
  }, [current, animateFlip, animateRiffle]);

  const nextSpread = uC(() => {
    if (current + 2 < TOTAL_PAGES) animateFlip("next");
  }, [current, animateFlip]);
  const prevSpread = uC(() => {
    if (current > 0) animateFlip("prev");
  }, [current, animateFlip]);

  uE(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); nextSpread(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prevSpread(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [nextSpread, prevSpread]);

  // ---------------- Manual corner drag ----------------
  const stageRef = uR(null);
  const [dragState, setDragState] = uS(null);

  const onCornerDown = uC((direction) => (e) => {
    if (flipping || riffle) return;
    e.preventDefault();
    const startX = e.clientX;
    setDragState({ direction, progress: 0, startX });
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const raw = direction === "next" ? -dx / 400 : dx / 400;
      const progress = Math.max(0, Math.min(1, raw));
      setDragState({ direction, progress, startX });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      setDragState(ds => {
        if (!ds) return null;
        if (ds.progress > 0.4) {
          const from = ds.progress;
          const start = performance.now();
          const dur = Math.max(200, (1 - from) * flipDurationMs);
          const tick = () => {
            const t = performance.now();
            const p = Math.min(1, (t - start) / dur);
            const eased = easeOutCubic(p);
            const prog = from + (1 - from) * eased;
            setDragState({ ...ds, progress: prog });
            if (p < 1) requestAnimationFrame(tick);
            else {
              setDragState(null);
              if (ds.direction === "next") setCurrent(c => Math.min(TOTAL_PAGES - 2, c + 2));
              else setCurrent(c => Math.max(0, c - 2));
            }
          };
          requestAnimationFrame(tick);
          return ds;
        } else {
          const from = ds.progress;
          const start = performance.now();
          const dur = Math.max(160, from * flipDurationMs * 0.6);
          const tick = () => {
            const t = performance.now();
            const p = Math.min(1, (t - start) / dur);
            const eased = easeOutCubic(p);
            const prog = from * (1 - eased);
            setDragState({ ...ds, progress: prog });
            if (p < 1) requestAnimationFrame(tick);
            else setDragState(null);
          };
          requestAnimationFrame(tick);
          return ds;
        }
      });
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }, [flipping, riffle, flipDurationMs]);

  const activeFlip = flipping || dragState;

  // ---------------- Ribbon ----------------
  const onRibbonDown = uC((e) => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const startY = e.clientY;
    let moved = false;
    setRibbonDrag({ offsetX: 0, offsetY: 0, moved: false });
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 5) moved = true;
      setRibbonDrag({ offsetX: dx, offsetY: dy, moved });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      if (moved) {
        // Drag = place bookmark at current spread
        setRibbonPage(current);
        setRibbonFlash(true);
        setTimeout(() => setRibbonFlash(false), 900);
      } else {
        // Click = jump to bookmark
        if (ribbonPage !== current) {
          if (Math.abs(ribbonPage - current) <= 2) animateFlip(ribbonPage > current ? "next" : "prev");
          else animateRiffle(current, ribbonPage);
        }
      }
      setRibbonDrag(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }, [current, ribbonPage, animateFlip, animateRiffle]);

  const currentBook = uM(() => {
    if (current < 4) return null;
    const idx = Math.floor((current - 4) / 2);
    return window.BIBLE_BOOKS[idx];
  }, [current]);

  const ribbonBook = uM(() => {
    if (ribbonPage < 4) return null;
    const idx = Math.floor((ribbonPage - 4) / 2);
    return window.BIBLE_BOOKS[idx];
  }, [ribbonPage]);

  const leftIdx = current;
  const rightIdx = current + 1;
  const nextLeftIdx = current + 2;
  const nextRightIdx = current + 3;
  const prevLeftIdx = current - 2;
  const prevRightIdx = current - 1;

  // Static pages shown beneath the flipping leaf. For prev flip the leaf rises off the LEFT, so the
  // destination's left page (prevLeftIdx) shows underneath. For next flip the leaf rises off the
  // RIGHT, so the destination's right page (nextRightIdx) shows underneath.
  const staticLeftIdx = activeFlip?.direction === "prev" ? prevLeftIdx : leftIdx;
  const staticRightIdx = activeFlip?.direction === "next" ? nextRightIdx : rightIdx;

  return (
    <>
      <div className="stage" ref={stageRef}>
        <div className="book-tilt">
          <div className={`book cover-${tweaks.cover} paper-${tweaks.paper}`}
            style={{
              width: `calc(var(--page-w) * 2)`,
              height: `var(--page-h)`,
            }}>
            <div className="book-base"></div>
            <div className="page-edges"></div>

            <div className="spread">
              <div className="page left">
                <div className="page-inner">
                  <PageContent pageIndex={staticLeftIdx} onPickBook={goToBook} />
                </div>
              </div>
              <div className="page right">
                <div className="page-inner">
                  <PageContent pageIndex={staticRightIdx} onPickBook={goToBook} />
                </div>
              </div>
            </div>

            {/* ------------ FLIPPING PAGE ------------
                Forward: angle 0→-180, origin left center, layer at right half.
                Backward: angle 0→+180, origin right center, layer at left half.
                Front face is what the user was just seeing; back face is the destination side. */}
            {activeFlip && (() => {
              const { direction, progress } = activeFlip;
              const angle = direction === "next" ? -progress * 180 : progress * 180;
              const frontIdx = direction === "next" ? rightIdx : leftIdx;
              const backIdx = direction === "next" ? nextLeftIdx : prevRightIdx;
              const frontSide = direction === "next" ? "right" : "left";
              const backSide = direction === "next" ? "left" : "right";
              const origin = direction === "next" ? "left center" : "right center";
              const left = direction === "next" ? "50%" : `calc(50% - var(--page-w))`;
              const lift = Math.sin(Math.PI * progress);
              const z = lift * 14;
              const shadowSide = direction === "next" ? -1 : 1;
              return (
                <div className="flip-layer" style={{
                  left,
                  transformOrigin: origin,
                  transform: `rotateY(${angle}deg) translateZ(${z}px)`,
                  filter: `drop-shadow(${shadowSide * 4 * lift}px ${6 * lift}px ${10 + 20 * lift}px rgba(0,0,0,${lift * 0.55}))`,
                }}>
                  <div className="flip-face front">
                    <div className={`page ${frontSide}`}>
                      <div className="page-inner">
                        <PageContent pageIndex={frontIdx} onPickBook={goToBook} />
                      </div>
                      <div className="curl-shadow" style={{
                        opacity: progress < 0.5 ? progress * 0.9 : 0,
                        background: direction === "next"
                          ? `linear-gradient(-90deg, rgba(0,0,0,${0.4 * progress}) 0%, rgba(0,0,0,${0.1 * progress}) 40%, transparent 70%)`
                          : `linear-gradient(90deg,  rgba(0,0,0,${0.4 * progress}) 0%, rgba(0,0,0,${0.1 * progress}) 40%, transparent 70%)`,
                      }}/>
                    </div>
                  </div>
                  <div className="flip-face back">
                    <div className={`page ${backSide}`}>
                      <div className="page-inner">
                        <PageContent pageIndex={backIdx} onPickBook={goToBook} />
                      </div>
                      <div className="curl-shadow" style={{
                        opacity: progress > 0.5 ? (1 - progress) * 0.9 : 0,
                        background: direction === "next"
                          ? `linear-gradient(90deg,  rgba(0,0,0,${0.4 * (1-progress)}) 0%, rgba(0,0,0,${0.1 * (1-progress)}) 40%, transparent 70%)`
                          : `linear-gradient(-90deg, rgba(0,0,0,${0.4 * (1-progress)}) 0%, rgba(0,0,0,${0.1 * (1-progress)}) 40%, transparent 70%)`,
                      }}/>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* ------------ RIFFLE (multi-sheet) ------------ */}
            {riffle && (() => {
              const { progress, sheetCount, direction } = riffle;
              const sheets = [];
              for (let i = 0; i < sheetCount; i++) {
                const delay = i / sheetCount * 0.5;
                const localProgress = Math.max(0, Math.min(1, (progress - delay) / 0.5));
                if (localProgress <= 0) continue;
                const angle = direction === "next" ? -localProgress * 180 : localProgress * 180;
                const z = Math.sin(Math.PI * localProgress) * 5;
                const origin = direction === "next" ? "left center" : "right center";
                const left = direction === "next" ? "50%" : `calc(50% - var(--page-w))`;
                sheets.push(
                  <div key={i} className="flip-layer" style={{
                    left,
                    transformOrigin: origin,
                    transform: `rotateY(${angle}deg) translateZ(${z + i * 0.3}px)`,
                    zIndex: 20 + i,
                  }}>
                    <div className="flip-face front">
                      <div className={`page ${direction === "next" ? "right" : "left"}`} style={{ opacity: 0.95 }}>
                        <div className="page-inner" style={{ padding: "20px 30px", opacity: 0.5 }}>
                          <div style={{ height: "100%",
                            background: "repeating-linear-gradient(0deg, rgba(50,30,10,0.12) 0 1.5px, transparent 1.5px 9px)",
                          }}/>
                        </div>
                      </div>
                    </div>
                    <div className="flip-face back">
                      <div className={`page ${direction === "next" ? "left" : "right"}`} style={{ opacity: 0.95 }}>
                        <div className="page-inner" style={{ padding: "20px 30px", opacity: 0.5 }}>
                          <div style={{ height: "100%",
                            background: "repeating-linear-gradient(0deg, rgba(50,30,10,0.12) 0 1.5px, transparent 1.5px 9px)",
                          }}/>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              }
              return sheets;
            })()}

            <div className="gutter"></div>

            {!activeFlip && !riffle && current + 2 < TOTAL_PAGES && (
              <div className="corner-hint" style={{ right: 0, bottom: 0 }}
                onMouseDown={onCornerDown("next")}
                title="Drag to flip forward"
              />
            )}
            {!activeFlip && !riffle && current > 0 && (
              <div className="corner-hint left-corner"
                onMouseDown={onCornerDown("prev")}
                title="Drag to flip back"
              />
            )}

            <Ribbon
              ribbonPage={ribbonPage}
              currentPage={current}
              ribbonBook={ribbonBook}
              totalPages={TOTAL_PAGES}
              onDown={onRibbonDown}
              dragging={!!ribbonDrag}
              drag={ribbonDrag}
              flash={ribbonFlash}
            />

            <ThumbTabs
              currentBook={currentBook}
              onPick={goToBook}
              disabled={!!activeFlip || !!riffle}
            />
          </div>
        </div>
      </div>

      <NavBar
        current={current}
        totalPages={TOTAL_PAGES}
        onPrev={prevSpread}
        onNext={nextSpread}
        onOpenTOC={() => animateRiffle(current, 2)}
        currentBook={currentBook}
        disabled={!!activeFlip || !!riffle}
      />
    </>
  );
}

// ------------- Ribbon -------------
function Ribbon({ ribbonPage, currentPage, ribbonBook, totalPages, onDown, dragging, drag, flash }) {
  const offset = ribbonPage - currentPage;
  const isHere = Math.abs(offset) < 2;
  const distanceFactor = Math.min(1, Math.abs(offset) / totalPages);
  const baseLen = isHere ? 240 : 260 + distanceFactor * 40;
  const sideShift = isHere ? 0 : (offset > 0 ? 6 : -6);
  const offsetX = drag?.offsetX || 0;
  const offsetY = drag?.offsetY || 0;
  const sway = dragging ? Math.min(24, Math.max(-24, offsetX * 0.14)) : 0;

  return (
    <div
      className="ribbon"
      onMouseDown={onDown}
      title={ribbonBook
        ? `Bookmark · ${ribbonBook.name}. Click to jump · drag to place here.`
        : "Bookmark. Click to jump · drag to place here."}
      style={{
        left: `calc(50% - 13px + ${sideShift}px)`,
        height: baseLen,
        transform: `rotate(${sway}deg) translate(${offsetX * 0.3}px, ${offsetY * 0.3}px)`,
        transition: dragging ? "none" : "height 420ms ease, left 420ms ease, transform 400ms ease, box-shadow 300ms ease",
        zIndex: 50,
        boxShadow: flash
          ? "inset 0 0 4px rgba(0,0,0,0.4), 2px 3px 12px rgba(255,210,150,0.9), 0 0 28px rgba(255,210,150,0.55)"
          : undefined,
      }}
    >
      {isHere && (
        <div style={{
          position: "absolute",
          top: 8, left: "50%", transform: "translateX(-50%)",
          fontSize: 9, color: "rgba(255,220,180,0.75)",
          fontFamily: "'Cinzel', serif", letterSpacing: "0.2em",
        }}>⁂</div>
      )}
      {flash && (
        <div style={{
          position: "absolute",
          top: -26, left: "50%", transform: "translateX(-50%)",
          whiteSpace: "nowrap",
          fontFamily: "'Cinzel', Georgia, serif",
          fontSize: 10, letterSpacing: "0.25em",
          color: "var(--gold-hi)",
          textShadow: "0 1px 4px rgba(0,0,0,0.8)",
          pointerEvents: "none",
          animation: "ribbon-flash 900ms ease forwards",
        }}>
          BOOKMARKED
        </div>
      )}
    </div>
  );
}

// ------------- Thumb-index tabs (group tabs with flyout picker) -------------
function ThumbTabs({ currentBook, onPick, disabled }) {
  const [openGroup, setOpenGroup] = uS(null);
  const [flyoutPlacement, setFlyoutPlacement] = uS("right");
  const closeTimerRef = uR(null);

  const cancelClose = uC(() => {
    if (closeTimerRef.current) {
      clearTimeout(closeTimerRef.current);
      closeTimerRef.current = null;
    }
  }, []);

  const scheduleClose = uC(() => {
    cancelClose();
    closeTimerRef.current = setTimeout(() => setOpenGroup(null), 260);
  }, [cancelClose]);

  uE(() => () => cancelClose(), [cancelClose]);

  const GROUPS = [
    { id: "Pentateuch", testament: "OT", label: "Pentateuch" },
    { id: "History", testament: "OT", label: "History (OT)" },
    { id: "Wisdom", testament: "OT", label: "Wisdom" },
    { id: "Major Prophets", testament: "OT", label: "Major Prophets" },
    { id: "Minor Prophets", testament: "OT", label: "Minor Prophets" },
    { id: "Gospels", testament: "NT", label: "Gospels" },
    { id: "History", testament: "NT", label: "History (NT)" },
    { id: "Epistles", testament: "NT", label: "Epistles" },
    { id: "Apocalyptic", testament: "NT", label: "Revelation" },
  ];

  const handleOpen = uC((key, el) => {
    if (disabled) return;
    cancelClose();
    if (el) {
      const rect = el.getBoundingClientRect();
      const roomRight = window.innerWidth - rect.right;
      setFlyoutPlacement(roomRight < 240 ? "left" : "right");
    }
    setOpenGroup(key);
  }, [disabled, cancelClose]);

  return (
    <div className="tabs right">
      {GROUPS.map((g) => {
        const isOT = g.testament === "OT";
        const isCurrent = currentBook && currentBook.group === g.id && currentBook.testament === g.testament;
        const books = window.BIBLE_BOOKS.filter(b => b.group === g.id && b.testament === g.testament);
        const key = g.testament + ":" + g.id;
        const isOpen = openGroup === key;
        return (
          <div
            key={key}
            className={`group-tab ${isOT ? "ot-group" : "nt-group"} ${isCurrent ? "current" : ""}`}
            onMouseEnter={(e) => handleOpen(key, e.currentTarget)}
            onMouseLeave={scheduleClose}
            onClick={() => {
              if (disabled) return;
              if (books[0]) onPick(books[0]);
              setOpenGroup(null);
            }}
          >
            {g.label}
            {isOpen && (
              <div
                className={`flyout flyout-${flyoutPlacement}`}
                onMouseEnter={cancelClose}
                onMouseLeave={scheduleClose}
                onClick={e => e.stopPropagation()}
              >
                <div className="flyout-title">{g.label}</div>
                {books.map(b => (
                  <div key={b.id}
                    className={`flyout-book ${currentBook?.id === b.id ? "current" : ""}`}
                    onClick={() => { onPick(b); setOpenGroup(null); }}
                  >
                    <span>{b.name}</span>
                    <span className="num">{b.chapters} ch</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ------------- Nav bar -------------
function NavBar({ current, totalPages, onPrev, onNext, onOpenTOC, currentBook, disabled }) {
  let label;
  if (current === 0) label = "Frontispiece";
  else if (current === 1 || current === 2) label = "Table of Contents";
  else if (current === 3) label = "New Testament · Contents";
  else if (currentBook) label = `${currentBook.name} · Ch. 1`;
  else label = "—";
  return (
    <div className="nav-controls">
      <button className="nav-btn" onClick={onPrev} disabled={disabled || current === 0}>‹</button>
      <button className="nav-btn" onClick={onOpenTOC} disabled={disabled} title="Table of Contents" style={{ fontSize: 11 }}>✦</button>
      <div className="nav-label">{label}</div>
      <button className="nav-btn" onClick={onNext} disabled={disabled || current + 2 >= totalPages}>›</button>
    </div>
  );
}

Object.assign(window, { Book, Ribbon, ThumbTabs, NavBar, TOTAL_PAGES, bookStartPage });

</script>
<script type="text/babel">
// App entry point
const { useState: useAppState, useEffect: useAppEffect } = React;

const DEFAULT_TWEAKS = /*EDITMODE-BEGIN*/{
  "paper": "aged",
  "cover": "brown",
  "fontSize": 15,
  "flipSpeed": 1100
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useAppState(() => {
    const saved = localStorage.getItem("bible-tweaks");
    return saved ? { ...DEFAULT_TWEAKS, ...JSON.parse(saved) } : DEFAULT_TWEAKS;
  });
  const [tweaksOpen, setTweaksOpen] = useAppState(false);

  useAppEffect(() => {
    localStorage.setItem("bible-tweaks", JSON.stringify(tweaks));
    document.documentElement.style.setProperty("--font-size", tweaks.fontSize + "px");
    document.documentElement.style.setProperty("--flip-speed", tweaks.flipSpeed + "ms");
  }, [tweaks]);

  // Responsive sizing
  useAppEffect(() => {
    const setSize = () => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      // Book will be ~2 * pageW wide; fit in 85% of viewport
      const maxW = vw * 0.88;
      const maxH = vh * 0.85;
      // Page aspect ~ 1 : 1.4 (portrait)
      let pageH = Math.min(maxH, maxW / 2 * 1.4);
      let pageW = pageH / 1.4;
      if (pageW * 2 > maxW) {
        pageW = maxW / 2;
        pageH = pageW * 1.4;
      }
      document.documentElement.style.setProperty("--page-w", pageW + "px");
      document.documentElement.style.setProperty("--page-h", pageH + "px");
    };
    setSize();
    window.addEventListener("resize", setSize);
    return () => window.removeEventListener("resize", setSize);
  }, []);

  // Tweaks mode integration
  useAppEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const updateTweak = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
  };

  return (
    <>
      <div className="table-surface"></div>
      <div className="candle-light"></div>

      <div className="chrome">
        <h1>The Holy Bible</h1>
        <div className="sub">King James Version · 1611</div>
      </div>

      <Book tweaks={tweaks} />

      {tweaksOpen && (
        <div className="tweaks-panel">
          <h3>Tweaks</h3>

          <div className="tweak-row">
            <label>Cover</label>
            <div className="options">
              {["brown", "burgundy", "black"].map(c => (
                <button key={c}
                  className={tweaks.cover === c ? "active" : ""}
                  onClick={() => updateTweak("cover", c)}
                >{c}</button>
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>Paper</label>
            <div className="tweak-swatches">
              {[
                { id: "aged", color: "#f2e8d0" },
                { id: "cream", color: "#faf3de" },
                { id: "linen", color: "#ede0c0" },
                { id: "antique", color: "#e8d9b3" },
              ].map(p => (
                <div key={p.id}
                  className={`tweak-swatch ${tweaks.paper === p.id ? "active" : ""}`}
                  style={{ background: p.color, borderColor: tweaks.paper === p.id ? "var(--gold-hi)" : "transparent" }}
                  onClick={() => updateTweak("paper", p.id)}
                  title={p.id}
                />
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>Font Size · {tweaks.fontSize}px</label>
            <input type="range" min="12" max="20" step="1"
              value={tweaks.fontSize}
              onChange={e => updateTweak("fontSize", parseInt(e.target.value, 10))}
            />
          </div>

          <div className="tweak-row">
            <label>Flip Speed · {tweaks.flipSpeed}ms</label>
            <input type="range" min="300" max="1600" step="50"
              value={tweaks.flipSpeed}
              onChange={e => updateTweak("flipSpeed", parseInt(e.target.value, 10))}
            />
          </div>

          <div style={{ marginTop: 16, paddingTop: 10, borderTop: "1px dotted var(--gold-dark)", fontSize: 9, opacity: 0.6, lineHeight: 1.6 }}>
            <div>✦ Click a tab on the right edge to jump to a book</div>
            <div>✦ Drag page corners to flip manually</div>
            <div>✦ Click the ribbon to jump to bookmark · drag to place it</div>
            <div>✦ Arrow keys navigate</div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
